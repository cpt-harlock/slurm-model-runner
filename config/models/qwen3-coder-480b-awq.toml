# Flagship for Claude Code (architecture.md §5). Full BF16 (~960 GB) does not
# fit in $FAST's 1 TB quota alongside qwen3-32b's weights (939 GB free) and
# needs 5-6 nodes; this AWQ-INT4 community checkpoint (~262 GB, verified via
# the HF API before staging: 53 safetensors files, ungated) fits comfortably
# and needs half the nodes. Marlin kernels run AWQ-INT4 fine on Ampere (SM80)
# -- this is not the FP8 problem (see EngineSpec's fp8 warning): AWQ quantizes
# weights only, not something A100 lacks hardware support for.
name = "qwen3-coder-480b-awq"
hf_repo = "TechxGenus/Qwen3-Coder-480B-A35B-Instruct-AWQ"
role = "primary"         # answers Claude Code's sonnet/opus alias; see mr.gateway

idle_timeout_s = 7200    # raised from the default 1800 (30 min): a real
                          # interactive Avante session kept getting reaped
                          # mid-work during normal pauses (reading, writing
                          # code by hand, thinking between requests), costing
                          # a ~6-7 min cold-start on the next request every
                          # time -- a real UX cost, not a bug (architecture.md
                          # §9 risk 30's "Open, not fully resolved" note).
                          # 2 hours trades more idle GPU-hours for staying
                          # warm through realistic work gaps; not applied to
                          # qwen3-32b or deepseek-v3.1-terminus, which don't
                          # have the same live-usage pattern driving this.
measured_load_s = 348    # job 54381732 (the tool-parser-fixed run); feeds
                         # mr.gateway's queue-aware wake ETA
# 407s measured load (job 54379904, first real bring-up) x1.5 (=610s) +
# ~45min queue margin, same formula as qwen3-32b.toml. queue_margin is still
# a guess for this topology (2 nodes vs. qwen3-32b's 1). Kept at the first
# run's 407s, not the later 348s -- more conservative and still valid either
# way.
handoff_lead_s = 3300

[slurm]                       # account/partition/qos/time: config/sites/
nodes = 2

[engine]
tensor_parallel_size = 4      # TP within each node, over NVLink
pipeline_parallel_size = 2    # PP across the 2 nodes, over IB
# Native max_position_embeddings is 262144 (262K) per the checkpoint's
# config.json. Started conservative at 65536 (9.14x concurrency headroom in
# the pinned 598,784-token KV pool at that setting) -- raised to 131072 after
# a real Avante session hit the ceiling live: a 57,345-token prompt plus an
# 8,192-token request summed to 65,537 against the old 65536 cap, and vLLM
# correctly 400'd (litellm.ContextWindowExceededError). Also exposed a real
# bug in mr.gateway.render()'s rendered model_info: max_input_tokens was set
# to the *full* max_model_len while max_output_tokens was set to a quarter
# of it *on top* -- double-counting a budget that vLLM enforces as
# prompt+completion combined, not two separate ceilings (fixed in gateway.py,
# architecture.md §9 risk 29). 131072 keeps 4.57x concurrency headroom in the
# same pinned KV pool (598784/131072) -- picked over jumping straight to the
# native 262144 ceiling (which would still fit, ~2.28x headroom) to stay
# conservative on CUDA-graph capture memory, since this model (unlike the
# DeepseekV3-family MLA models) does not run with --enforce-eager and doubling
# max_model_len can grow graph-capture buffer requirements in ways the KV pool
# math alone doesn't cover -- verified via a real bring-up before trusting it,
# not assumed from the KV math alone.
#
# Raised again to the native 262144 ceiling after the SAME live Avante
# session hit 131072 too, within the same hour: a 122,881-token prompt plus
# an 8,192-token request summed to 131,073. This is real, fast agentic-
# session context growth (tool-heavy conversations accumulate history
# quickly), not a one-off -- and 262144 is this checkpoint's actual maximum
# (max_position_embeddings per config.json), so there is no higher ceiling
# to raise to if a session grows past this too. At that point the fix is
# session-side (compact/restart the conversation), not server-side. Keeps
# ~2.28x concurrency headroom in the pinned 598,784-token KV pool
# (598784/262144) -- positive but the tightest of the three settings tried;
# verified via a real bring-up (not assumed) specifically because this is
# now a 4x jump from the original conservative starting point and
# CUDA-graph capture memory at this size was a real unknown, not a
# formality.
max_model_len = 262144
gpu_memory_utilization = 0.85
# --kv-cache-memory-bytes pins the KV cache pool explicitly, same lesson as
# qwen3-32b.toml (architecture.md §9 risk 9): this value is specific to this
# checkpoint/topology (TP4xPP2, AWQ-INT4, 8 GPUs) and does not carry over to
# any other. From job 54379904's own diagnostic: "Free memory on device
# (61.74/63.42 GiB)... Replace gpu_memory_utilization config with
# `--kv-cache-memory=15404725044` (14.35 GiB) to fit into requested memory".
# Pinned before this was ever left to auto-size and OOM on a less-generous
# node, the way qwen3-32b.toml's history shows it eventually will.
#
# --tool-call-parser qwen3_coder (not hermes): this model emits tool calls as
# <tool_call><function=NAME><parameter=KEY>VALUE</parameter></function>
# </tool_call>, not hermes's JSON-in-XML format. With hermes, vLLM returned
# the tool call as *raw unparsed text* in `content` instead of a structured
# tool_calls array -- confirmed live, this is what real tool use looked like
# before the fix. `qwen3_coder` (alias `qwen3_xml`) is the parser vLLM
# actually registers for this exact syntax (vllm/tool_parsers/__init__.py:
# both names map to Qwen3EngineToolParser, whose
# structural_tag_model = "qwen_3_coder" names this model family specifically).
# Per architecture.md §7, tool calling is not optional -- Claude Code is
# close to useless without it, so this was caught and fixed before treating
# this model as usable, not after.
extra_args = [
  "--enable-auto-tool-choice", "--tool-call-parser", "qwen3_coder",
  "--kv-cache-memory-bytes", "15404725044",
]
