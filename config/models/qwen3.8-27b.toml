# Qwen3.8-27B, official BF16 checkpoint (Qwen/Qwen3.8-27B). Dense, same
# Gated-DeltaNet/attention family as qwen3.8-2.4t-mxfp4. ~54 GiB of weights:
# fits one H100 node (TP4) with plenty of KV room. First bring-up 2026-11-13 (job 2843821, vllm 0.32.0): completion, reasoning split
# and an auto tool call all work. Context 131072 is untested beyond that.
name = "qwen3.8-27b"
hf_repo = "Qwen/Qwen3.8-27B"
weights_dir = "$SCRATCH/weights/Qwen3.8-27B"
sif = "vllm-0.32.sif"

idle_timeout_s = 1800
handoff_lead_s = 3600   # placeholder until a real bring-up measures load time
# Leonardo (A100, job 64401851, 2026-11-13): READY after 633 s -- weights in
# 17 s, the rest a first-time torch.compile (cached for later runs). KV cache
# 2,039,148 tokens (15.56x at 131072). Completion, reasoning split and an auto
# tool call all work, directly and through the gateway; ~60 tok/s single-stream.
# The Gated DeltaNet Triton kernels run on SM80.
measured_load_s = 633

[slurm]                       # account/partition/qos/time: config/sites/
nodes = 1

[engine]
tensor_parallel_size = 4
pipeline_parallel_size = 1
max_model_len = 131072
gpu_memory_utilization = 0.85
extra_args = [
  "--enable-auto-tool-choice", "--tool-call-parser", "qwen3_coder",
  "--reasoning-parser", "qwen3",
]


# The chat template accepts only xhigh (default), medium and low and raises on
# anything else -> HTTP 400. Clients send "high"; LiteLLM turns Claude Code's
# thinking budgets into "high" (>=4096) or "minimal" (<1024). The gateway's
# LiteLLM hook (src/mr/litellm_hooks.py) rewrites them with this table.
[reasoning_effort_map]
high = "xhigh"
max = "xhigh"
minimal = "low"
none = "low"

[sites.pitagora]
sif = ""                      # the site's single image, vllm.sif (v0.32.0-cu129)
measured_load_s = 226         # job 2843821: READY after 226 s (KV cache 3.96M tokens)
