# Phase 4 multi-node validation ONLY -- not a real deployment target.
#
# Deliberately over-provisions Qwen3-32B (which needs just 1 node normally,
# see qwen3-32b.toml) across 4 nodes purely to exercise `ray symmetric-run` +
# cross-node NCCL/IB + pipeline parallelism, using weights already staged on
# $FAST -- no new download needed to hit Phase 4's "4+ nodes stable under
# load" exit criterion. Same hf_repo -> same weights_dir as qwen3-32b.toml
# (config.py derives it from hf_repo), so this reuses the existing download.
name = "qwen3-32b-4n"
hf_repo = "Qwen/Qwen3-32B"

idle_timeout_s = 900     # short -- this should never be left up outside a test

[slurm]
account = "cin_staff"
partition = "boost_usr_prod"
qos = "boost_qos_lprod"       # 4 days, <=8 nodes / 32 GPUs; we use 4
nodes = 4
time = "0-01:00:00"           # 1h ceiling -- this is a mechanism test, not a service
cpus_per_task = 32
gpus_per_node = 4

[engine]
tensor_parallel_size = 4      # TP within each node, over NVLink
pipeline_parallel_size = 4    # PP across the 4 nodes, over IB -- the thing being tested
max_model_len = 32768
gpu_memory_utilization = 0.85 # more conservative than qwen3-32b.toml's 0.90: this topology's
                               # per-GPU memory footprint is untested, no measured
                               # --kv-cache-memory-bytes value exists for it yet (see
                               # architecture.md §9 risk 9 -- that value was tuned for TP=4/PP=1
                               # specifically and does not carry over to a different topology)
extra_args = [
  "--enable-auto-tool-choice", "--tool-call-parser", "hermes",
  "--reasoning-parser", "qwen3",
]
